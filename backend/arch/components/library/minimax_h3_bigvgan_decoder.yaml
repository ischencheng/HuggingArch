  activation_post: { op: snake_beta, in: [stage6_mean, activation_post.upsample, activation_post.downsample.lowpass], dims: { dim: "d_audio_dec // 128", kernel_size: n_aa_taps }, weight_axes: [{ replicated: true }] }
