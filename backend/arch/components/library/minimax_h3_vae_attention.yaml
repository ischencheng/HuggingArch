# MiniMax-H3 video ViT-decoder attention (diffusers `MiniMaxH3VideoAttention`
# + `MiniMaxH3VideoAttnProcessor`): biased Q/K/V, per-head RMSNorm with no
# learnable gain (`elementwise_affine=False`, computed in float32), the 3-D
# RoPE on the first `rope_dim_ratio` of each head, full attention over the
# tile's tokens (`attn_mask=None`), biased output projection. An encoder's
# attention: no cache.
#
# Required dims: d_model, n_heads, d_head, d_rope, d_nope

role: attention
description: "Video ViT-decoder attention: biased Q/K/V, unscaled per-head RMSNorm, partial 3-D RoPE, full attention over one tile."
cache:
  family: ViT
  entries: []
graph:
  to_q:
    op: linear
    in: x
    dims: { in: d_model, out: "n_heads * d_head", bias: "1" }
    weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }]
  to_k:
    op: linear
    in: x
    dims: { in: d_model, out: "n_heads * d_head", bias: "1" }
    weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }]
  to_v:
    op: linear
    in: x
    dims: { in: d_model, out: "n_heads * d_head", bias: "1" }
    weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }]
  q_split_heads: { op: head_split, in: to_q, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads: { op: head_split, in: to_k, dims: { n_heads: n_heads, d_head: d_head } }
  v_split_heads: { op: head_split, in: to_v, dims: { n_heads: n_heads, d_head: d_head } }
  norm_q:        { op: rmsnorm_unscaled, in: q_split_heads, dim: d_head }
  norm_k:        { op: rmsnorm_unscaled, in: k_split_heads, dim: d_head }
  q_rope:        { op: partial_rope_3d, in: norm_q, module: null, dims: { d_head: d_head, d_rope: d_rope, d_nope: d_nope } }
  k_rope:        { op: partial_rope_3d, in: norm_k, module: null, dims: { d_head: d_head, d_rope: d_rope, d_nope: d_nope } }
  qk_score:      { op: attention_score, in: [q_rope, k_rope], dims: { is_causal: "0", n_heads: n_heads, d_head: d_head } }
  softmax:       { op: softmax, in: qk_score, dims: { is_causal: "0", n_heads: n_heads } }
  attn_apply:    { op: attention_apply, in: [softmax, v_split_heads], dims: { is_causal: "0", n_heads: n_heads, d_head: d_head } }
  o_merge_heads: { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  to_out.0:
    op: linear
    in: o_merge_heads
    dims: { in: "n_heads * d_head", out: d_model, bias: "1" }
    weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }]
outputs: [to_out.0]
